# Grouped per ecosystem so one upstream release does not arrive as several pull requests.
#
# Two grouping mechanisms are in play, because they cover different things:
#   multi-ecosystem-groups  version updates, collapsed across ecosystems into one PR
#   groups + applies-to     security updates, which multi-ecosystem groups do NOT cover
# Without the second block every advisory arrives as its own pull request.
#
# The five-day cooldown is a supply-chain control, not a convenience. Most malicious releases in recent
# memory were detected and yanked within hours, so waiting before adopting a new version neutralises
# that class of attack. Security updates are unaffected: they are driven by advisories and ignore this.

version: 2

multi-ecosystem-groups:
  app:
    schedule:
      interval: weekly
  github-actions:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    multi-ecosystem-group: app
    directory: /
    patterns:
      - '*'
    cooldown:
      default-days: 5
    labels:
      - dependencies
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # `/` covers .github/workflows.
  - package-ecosystem: github-actions
    multi-ecosystem-group: github-actions
    directory: /
    patterns:
      - '*'
    cooldown:
      default-days: 5
    labels:
      - dependencies
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
